<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramah in the Rockies</title>
  <meta name="description" content="Photographs from Ramah in the Rockies." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Abba Photo</p>
      <h1 class="title">Ramah in the Rockies</h1>
      <p class="subtitle">Summer 2026</p>
    </div>
    <div class="scroll-cue" aria-hidden="true">
      <span></span>
    </div>
  </header>

  <main>
    <section id="featured" class="featured" aria-label="Featured photographs"></section>

    <section class="grid-section" aria-label="Gallery">
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Photographs by Noah Gallagher</p>
    <p class="muted">Abba Photo</p>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Photo viewer">
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous">&#8249;</button>
    <button class="lb-next" aria-label="Next">&#8250;</button>
    <div class="lb-stage">
      <img class="lb-img" alt="" />
    </div>
    <div class="lb-counter"></div>
  </div>

  <script src="js/manifest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
